<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Guard</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1A1A1A">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #F9F7F2; --accent: #B8860B; --text: #1A1A1A; --risk-color: #B8860B; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; margin: 0; }
        .app-container { width: 100%; max-width: 450px; padding: 40px 25px; text-align: center; display: flex; flex-direction: column; box-sizing: border-box; }
        h1 { font-family: 'Playfair Display', serif; text-transform: uppercase; letter-spacing: 2px; margin-top: 50px; }
        
        .input-group { 
            background: white; padding: 10px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(184,134,11,0.1); margin: 25px 0; border: 1px solid rgba(184,134,11,0.2); 
        }
        input { width: 100%; border: none; padding: 15px; outline: none; font-size: 16px; background: transparent; font-family: 'Inter', sans-serif; box-sizing: border-box; text-align: center; }

        .main-btn { 
            width: 100%; background: #1A1A1A; color: white; border: none; padding: 20px; border-radius: 18px; 
            font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
        }

        .risk-gauge { width: 100%; height: 8px; background: #eee; border-radius: 10px; margin: 25px 0 10px 0; overflow: hidden; display: none; }
        .risk-fill { height: 100%; width: 0%; background: var(--risk-color); transition: width 1.5s ease-in-out, background 0.5s; }
        .risk-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; display: none; color: var(--risk-color); text-align: left; }

        .result-area { 
            margin-top: 20px; display: none; background: white; padding: 25px; border-radius: 20px; 
            text-align: left; border-left: 4px solid var(--risk-color); box-shadow: 0 10px 30px rgba(0,0,0,0.05); line-height: 1.6; 
        }
        #aiResponse { font-size: 15px; color: #333; }
        #aiResponse b { color: var(--accent); font-family: 'Playfair Display', serif; display: block; margin-top: 15px; font-size: 17px; }

        .share-btn {
            display: none; width: 100%; background: transparent; color: #1A1A1A; border: 2px solid #1A1A1A; 
            padding: 15px; border-radius: 18px; font-weight: 600; cursor: pointer; text-transform: uppercase; 
            letter-spacing: 1px; margin-top: 15px; transition: 0.3s; font-size: 13px;
        }
        .share-btn:hover { background: #1A1A1A; color: white; }

        .footer-trust { margin-top: auto; padding: 40px 0 20px 0; font-size: 11px; letter-spacing: 1px; color: #A0A0A0; text-transform: uppercase; }
        .footer-trust b { color: var(--accent); font-weight: 600; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Shopping Guard</h1>
    <p style="font-size: 10px; letter-spacing: 3px; color: #888; margin-top: -10px;">YOUR PERSONAL AI CRITIC 2026</p>

    <div class="input-group">
        <input type="text" id="productLink" placeholder="Вставьте ссылку на товар..." oninput="updateNameField()">
        <input type="text" id="productPrice" inputmode="numeric" placeholder="Цена, ₽" style="border-top: 1px solid rgba(184,134,11,0.15);">
        <input type="text" id="productName" placeholder="Что это за товар?" style="border-top: 1px solid rgba(184,134,11,0.15); display: none;">
    </div>
    <p id="nameToggle" onclick="showNameField()" style="font-size: 12px; color: #888; margin: -12px 0 20px; cursor: pointer; text-decoration: underline;">Нет ссылки? Напишите, что за товар</p>

    <button class="main-btn" onclick="startAnalysis()">Проверить товар</button>

    <div id="riskLabel" class="risk-label">Уровень импульсивного риска</div>
    <div id="riskGauge" class="risk-gauge">
        <div id="riskFill" class="risk-fill"></div>
    </div>

    <div class="result-area" id="resultArea">
        <div id="aiResponse"></div>
    </div>

    <button id="shareBtn" class="share-btn" onclick="shareVerdict()">🔗 Поделиться вердиктом</button>

    <div class="footer-trust">
        Powered by <b>Neural Data 2026</b><br>
        Мы на стороне вашего кошелька
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' });
        // Пришла новая версия приложения — один раз перезагружаемся, чтобы её показать
        let reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!reloaded) { reloaded = true; window.location.reload(); }
        });
    }

    function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    let currentScore = 0;
    let currentObject = "";

    function showNameField() {
        document.getElementById('productName').style.display = 'block';
        document.getElementById('nameToggle').style.display = 'none';
        document.getElementById('productName').focus();
    }

    // Товары Wildberries узнаём по ссылке сами; для других магазинов сразу просим написать, что это
    function updateNameField() {
        const value = document.getElementById('productLink').value;
        const hasUrl = /https?:\/\/|www\./i.test(value);
        const isWb = /wildberries|wb\.ru|wb\.click/i.test(value);
        const nameField = document.getElementById('productName');
        if (hasUrl && !isWb) {
            nameField.style.display = 'block';
            nameField.placeholder = 'Что это за товар? (этот магазин не отдаёт название)';
            document.getElementById('nameToggle').style.display = 'none';
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        const parsedUrl = new URL(window.location);
        // Из «Поделиться» маркетплейса приходят название, текст и ссылка — собираем всё вместе
        const incomingText = ['title', 'text', 'url']
            .map((key) => parsedUrl.searchParams.get(key) || "")
            .filter((value, i, all) => value && all.indexOf(value) === i)
            .join(' ');

        if (incomingText) {
            document.getElementById('productLink').value = incomingText;
            updateNameField();
            document.getElementById('productPrice').focus();
        }
    });

    async function startAnalysis() {
        const link = document.getElementById('productLink').value.trim();
        const name = document.getElementById('productName').value.trim();
        const price = document.getElementById('productPrice').value.replace(/[^\d]/g, '');

        const responseArea = document.getElementById('aiResponse');
        const resultArea = document.getElementById('resultArea');
        const gauge = document.getElementById('riskGauge');
        const fill = document.getElementById('riskFill');
        const label = document.getElementById('riskLabel');
        const shareBtn = document.getElementById('shareBtn');

        if (!link && !name) return alert("Вставьте ссылку на товар или напишите, что это");
        
        resultArea.style.display = 'block';
        gauge.style.display = 'none';
        label.style.display = 'none';
        shareBtn.style.display = 'none';
        fill.style.width = '0%';
        responseArea.innerHTML = "<b>Анализирую товар...</b><br>Включаю здравый смысл.";

        // Ждём не дольше минуты, потом честно говорим, что сервер не ответил
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 60000);

        try {
            const response = await fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ link: link, name: name, price: price }),
                signal: controller.signal
            });

            let data;
            try {
                data = await response.json();
            } catch (_) {
                data = { success: false, error: "сервер вернул непонятный ответ (код " + response.status + ")" };
            }

            if (data.success) {
                // Вытаскиваем оценку риска из ответа ИИ
                const scoreMatch = data.text.match(/\[SCORE:\s*(\d+)\]/);
                currentScore = scoreMatch ? parseInt(scoreMatch[1]) : 50;
                let cleanText = data.text.replace(/\[SCORE:\s*\d+\]/g, '');

                // Вытаскиваем название объекта для кнопки "поделиться"
                const objMatch = cleanText.match(/🔍 \*\*ОБЪЕКТ:\*\* (.*)/);
                currentObject = data.product ? data.product.title
                    : objMatch ? objMatch[1].replace(/<\/?[^>]+(>|$)/g, "") : "Товар";

                gauge.style.display = 'block';
                label.style.display = 'block';
                shareBtn.style.display = 'block';
                
                let color = '#2ECC71'; 
                if (currentScore > 30) color = '#E67E22'; 
                if (currentScore > 70) color = '#C0392B'; 
                
                document.documentElement.style.setProperty('--risk-color', color);
                setTimeout(() => { fill.style.width = currentScore + '%'; }, 100);

                // Красиво форматируем заголовки
                responseArea.innerHTML = escapeHtml(cleanText).replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
            } else if (data.needName) {
                // Товар по ссылке не узнали (например, Ozon) — просим написать, что это
                showNameField();
                responseArea.innerHTML = "<b>Не узнали товар по ссылке</b>Напишите в строке выше, что это за товар, и нажмите «Проверить» ещё раз.";
            } else {
                responseArea.innerHTML = "<b>Не получилось</b>" + escapeHtml(data.error || "неизвестная ошибка");
            }
        } catch (e) {
            let reason = "Не удалось связаться с сервером. Проверьте интернет и попробуйте ещё раз.";
            if (e.name === 'AbortError') reason = "Сервер не ответил за минуту. Попробуйте ещё раз чуть позже.";
            else if (!navigator.onLine) reason = "Нет интернета.";
            responseArea.innerHTML = "<b>Нет связи</b>" + reason;
        } finally {
            clearTimeout(timer);
        }
    }

    function shareVerdict() {
        let statusEmoji = "✅";
        if (currentScore > 30) statusEmoji = "⚠️";
        if (currentScore > 70) statusEmoji = "❌";

        const shareText = `🕵️‍♂️ Shopping Guard проверил товар:\n📦 ${currentObject}\n${statusEmoji} Индекс риска: ${currentScore}%\n\nПроверь свою корзину перед покупкой:`;
        
        if (navigator.share) {
            navigator.share({ title: 'Вердикт Shopping Guard', text: shareText, url: window.location.origin }).catch(console.error);
        } else {
            navigator.clipboard.writeText(`${shareText} ${window.location.origin}`);
            alert("Скопировано в буфер обмена!");
        }
    }
</script>
</body>
</html>
