<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Guard | Premium AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Основные настройки дизайна */
        :root { --bg: #F9F7F2; --accent: #B8860B; --text: #1A1A1A; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; margin: 0; }
        .app-container { width: 100%; max-width: 450px; padding: 40px 25px; text-align: center; }
        h1 { font-family: 'Playfair Display', serif; text-transform: uppercase; letter-spacing: 2px; margin-top: 50px; }
        
        .input-group { 
            background: white; 
            padding: 10px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(184,134,11,0.1); 
            margin: 30px 0; 
            border: 1px solid rgba(184,134,11,0.2); 
            text-align: left;
        }
        
        input { 
            width: 100%; 
            border: none; 
            padding: 15px; 
            outline: none; 
            font-size: 15px; 
            background: transparent; 
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
        }

        .divider { border: 0; border-top: 1px solid #eee; margin: 5px 15px; }

        .main-btn { 
            width: 100%; 
            background: #1A1A1A; 
            color: white; 
            border: none; 
            padding: 20px; 
            border-radius: 18px; 
            font-weight: 600; 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            transition: 0.3s;
        }
        
        .main-btn:hover { background: #333; }

        /* СТИЛИ ДЛЯ ОТВЕТА (ТО, ЧТО ТЫ СПРАШИВАЛА) */
        .result-area { 
            margin-top: 30px; 
            display: none; 
            background: white; 
            padding: 25px; 
            border-radius: 20px; 
            text-align: left; 
            border-left: 4px solid var(--accent); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            line-height: 1.6; 
        }

        #aiResponse {
            font-size: 15px;
            color: #333;
            /* Анимация появления */
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Красивое выделение жирного текста от ИИ */
        #aiResponse b { 
            color: var(--accent); 
            font-family: 'Playfair Display', serif; 
            display: block; 
            margin-top: 15px; 
            font-size: 17px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Shopping Guard</h1>
    <p style="font-size: 10px; letter-spacing: 3px; color: #888; margin-top: -10px;">AI FINANCIAL CONCIERGE</p>

    <div class="input-group">
        <input type="text" id="productLink" placeholder="Вставьте ссылку на товар...">
        <div class="divider"></div>
        <input type="text" id="productName" placeholder="Что это? (например: Тушь для ресниц)">
    </div>

    <button class="main-btn" onclick="startAnalysis()">Проверить целесообразность</button>

    <div class="result-area" id="resultArea">
        <div id="aiResponse"></div>
    </div>
</div>

<script>
    async function startAnalysis() {
        const link = document.getElementById('productLink').value;
        const name = document.getElementById('productName').value;
        const responseArea = document.getElementById('aiResponse');
        const resultArea = document.getElementById('resultArea');

        if(!link && !name) return alert("Пожалуйста, введите данные");
        
        resultArea.style.display = 'block';
        responseArea.innerHTML = "<b>Анализирую...</b><br>Сверяю с финансовыми целями.";

        try {
            const response = await fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    link: "Товар: " + name + " | Ссылка: " + link 
                })
            });
            const data = await response.json();
            
            if (data.success) {
                // Превращаем текст от ИИ в красивый HTML (жирный шрифт и переносы)
                let formattedText = data.text
                    .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>') // Делаем текст между ** жирным
                    .replace(/\n/g, '<br>'); // Делаем переносы строк
                
                responseArea.innerHTML = formattedText;
            } else {
                responseArea.innerHTML = "Ошибка: " + data.error;
            }
        } catch (e) {
            responseArea.innerHTML = "Ошибка связи с сервером.";
        }
    }
</script>

</body>
</html>
