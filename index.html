<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Guard | Premium AI</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1A1A1A">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #F9F7F2; --accent: #B8860B; --text: #1A1A1A; --risk-color: #B8860B; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; margin: 0; }
        .app-container { width: 100%; max-width: 450px; padding: 40px 25px; text-align: center; display: flex; flex-direction: column; box-sizing: border-box; }
        h1 { font-family: 'Playfair Display', serif; text-transform: uppercase; letter-spacing: 2px; margin-top: 50px; }
        
        .input-group { 
            background: white; padding: 10px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(184,134,11,0.1); margin: 25px 0; border: 1px solid rgba(184,134,11,0.2); 
            text-align: left;
        }
        input { width: 100%; border: none; padding: 12px 15px; outline: none; font-size: 15px; background: transparent; font-family: 'Inter', sans-serif; box-sizing: border-box; }
        .divider { border: 0; border-top: 1px solid #eee; margin: 5px 15px; }
        
        .price-row { display: flex; justify-content: space-between; }
        .price-row input { width: 50%; }
        .price-row .divider-v { border-left: 1px solid #eee; margin: 5px 0; }

        .main-btn { 
            width: 100%; background: #1A1A1A; color: white; border: none; padding: 20px; border-radius: 18px; 
            font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
        }

        .risk-gauge { width: 100%; height: 8px; background: #eee; border-radius: 10px; margin: 25px 0 10px 0; overflow: hidden; display: none; }
        .risk-fill { height: 100%; width: 0%; background: var(--risk-color); transition: width 1.5s ease-in-out, background 0.5s; }
        .risk-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; display: none; color: var(--risk-color); text-align: left; }

        .result-area { 
            margin-top: 20px; display: none; background: white; padding: 25px; border-radius: 20px; 
            text-align: left; border-left: 4px solid var(--risk-color); box-shadow: 0 10px 30px rgba(0,0,0,0.05); line-height: 1.6; 
        }
        #aiResponse { font-size: 15px; color: #333; }
        #aiResponse b { color: var(--accent); font-family: 'Playfair Display', serif; display: block; margin-top: 15px; font-size: 17px; }

        .share-btn {
            display: none; width: 100%; background: transparent; color: #1A1A1A; border: 2px solid #1A1A1A; 
            padding: 15px; border-radius: 18px; font-weight: 600; cursor: pointer; text-transform: uppercase; 
            letter-spacing: 1px; margin-top: 15px; transition: 0.3s; font-size: 13px;
        }
        .share-btn:hover { background: #1A1A1A; color: white; }

        .footer-trust { margin-top: auto; padding: 40px 0 20px 0; font-size: 11px; letter-spacing: 1px; color: #A0A0A0; text-transform: uppercase; }
        .footer-trust b { color: var(--accent); font-weight: 600; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Shopping Guard</h1>
    <p style="font-size: 10px; letter-spacing: 3px; color: #888; margin-top: -10px;">AI FINANCIAL CONCIERGE 2026</p>

    <div class="input-group">
        <input type="text" id="productLink" placeholder="Ссылка на товар...">
        <div class="divider"></div>
        <input type="text" id="productName" placeholder="Название товара">
        <div class="divider"></div>
        <div class="price-row">
            <input type="text" id="priceNow" placeholder="Цена сейчас (₽)">
            <div class="divider-v"></div>
            <input type="text" id="priceOld" placeholder="Зачёркнутая (₽)">
        </div>
    </div>

    <button class="main-btn" onclick="startAnalysis()">Проверить целесообразность</button>

    <div id="riskLabel" class="risk-label">Уровень импульсивного риска</div>
    <div id="riskGauge" class="risk-gauge">
        <div id="riskFill" class="risk-fill"></div>
    </div>

    <div class="result-area" id="resultArea">
        <div id="aiResponse"></div>
    </div>

    <button id="shareBtn" class="share-btn" onclick="shareVerdict()">🔗 Поделиться вердиктом</button>

    <div class="footer-trust">
        Powered by <b>Neural Data 2026</b><br>
        Мы на стороне вашего кошелька
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }

    let currentScore = 0;
    let currentObject = "";

    // АВТО-ПАРСЕР ДЛЯ КНОПКИ "ПОДЕЛИТЬСЯ" ИЗ WILDBERRIES / OZON
    window.addEventListener('DOMContentLoaded', () => {
        const parsedUrl = new URL(window.location);
        // Получаем весь текст, который прилетел из маркетплейса
        const incomingText = parsedUrl.searchParams.get('text') || parsedUrl.searchParams.get('url') || "";
        
        if (incomingText) {
            // 1. Ищем ссылку на маркетплейс в тексте
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            const foundUrl = incomingText.match(urlRegex);
            if (foundUrl) { document.getElementById('productLink').value = foundUrl[0]; }

            // 2. Ищем цену (например: "2 056 ₽", "2056 руб" или просто цифры)
            // Ищем паттерны цен в прилетевшем тексте маркетплейса
            const cleanIncoming = incomingText.replace(/\s/g, ''); // убираем пробелы в цифрах типа 7 328
            
            // Пробуем вытащить текущую и старую цену, если маркетплейс их отдал в тексте шеринга
            const prices = cleanIncoming.match(/\d+/g);
            if (prices && prices.length >= 2) {
                // Если маркетплейсы отдают данные в формате Название + Цена + Старая цена
                // Нам нужно отделить их. Но чтобы не гадать, мы передадим весь исходный текст шеринга в ИИ!
            }
            
            // Самое надежное решение: записываем весь прилетевший текст в поле Название, 
            // чтобы ИИ сам внутри себя его разобрал, так как он понимает русский язык идеально!
            document.getElementById('productName').value = incomingText.replace(urlRegex, '').trim();
            
            // Сразу запускаем анализ, чтобы всё произошло в один клик!
            startAnalysis();
        }
    });

    async function startAnalysis() {
        const link = document.getElementById('productLink').value;
        const name = document.getElementById('productName').value;
        const priceNow = document.getElementById('priceNow').value;
        const priceOld = document.getElementById('priceOld').value;
        
        const responseArea = document.getElementById('aiResponse');
        const resultArea = document.getElementById('resultArea');
        const gauge = document.getElementById('riskGauge');
        const fill = document.getElementById('riskFill');
        const label = document.getElementById('riskLabel');
        const shareBtn = document.getElementById('shareBtn');

        if(!link && !name) return alert("Пожалуйста, введите данные");
        
        resultArea.style.display = 'block';
        gauge.style.display = 'none';
        label.style.display = 'none';
        shareBtn.style.display = 'none';
        fill.style.width = '0%';
        responseArea.innerHTML = "<b>Анализирую...</b><br>Сверяю с базой достоверности 2026.";

        try {
            const response = await fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    link: "Контекст из маркетплейса: " + name + " | Ссылка: " + link,
                    priceNow: priceNow,
                    priceOld: priceOld
                })
            });
            const data = await response.json();
            
            if (data.success) {
                const scoreMatch = data.text.match(/\[SCORE:\s*(\d+)\]/);
                currentScore = scoreMatch ? parseInt(scoreMatch[1]) : 50;
                let cleanText = data.text.replace(/\[SCORE:\s*\d+\]/g, '');

                const objMatch = cleanText.match(/🔍 \*\*ОБЪЕКТ:\*\* (.*)/);
                currentObject = objMatch ? objMatch[1].replace(/<\/?[^>]+(>|$)/g, "") : "Товар";

                gauge.style.display = 'block';
                label.style.display = 'block';
                shareBtn.style.display = 'block';
                
                let color = '#B8860B'; 
                if (currentScore > 30) color = '#E67E22'; 
                if (currentScore > 70) color = '#C0392B'; 
                
                document.documentElement.style.setProperty('--risk-color', color);
                setTimeout(() => { fill.style.width = currentScore + '%'; }, 100);

                responseArea.innerHTML = cleanText.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
            } else {
                responseArea.innerHTML = "Ошибка: " + data.error;
            }
        } catch (e) {
            responseArea.innerHTML = "Ошибка связи с сервером.";
        }
    }

    function shareVerdict() {
        let statusEmoji = "✅";
        if (currentScore > 30) statusEmoji = "⚠️";
        if (currentScore > 70) statusEmoji = "❌";

        const shareText = `Shopping Guard 2026 проверил товар:\n🕵️‍♂️ ${currentObject}\n${statusEmoji} Уровень импульсивного риска: ${currentScore}%\n\nПроверить свою корзину можно здесь:`;
        
        if (navigator.share) {
            navigator.share({ title: 'Вердикт Shopping Guard', text: shareText, url: window.location.origin }).catch(console.error);
        } else {
            navigator.clipboard.writeText(`${shareText} ${window.location.origin}`);
            alert("Скопировано в буфер обмена!");
        }
    }
</script>
</body>
</html>
